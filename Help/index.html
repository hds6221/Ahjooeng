<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahjooeng 도움말</title>
<style>
  :root{--bar:#22262c;--side:#f4f6f8;--ink:#1f2328;--muted:#5b6470;--line:#d9dee4;--blue:#0a7bc2;--blue-soft:#e8f3fb;--paper:#fff}
  *{box-sizing:border-box}
  body{margin:0;font-family:"맑은 고딕","Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.65;font-size:15px}
  header{position:sticky;top:0;z-index:5;background:var(--bar);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 22px}
  header .logo{font-weight:700;letter-spacing:.3px}
  header .logo b{color:#4fb3ef}
  header .crumb{color:#aab3bd;font-size:13px}
  .wrap{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 44px)}
  nav{background:var(--side);border-right:1px solid var(--line);padding:18px 0;position:sticky;top:44px;align-self:start;height:calc(100vh - 44px);overflow:auto}
  nav p{margin:14px 20px 6px;font-size:12px;color:var(--muted);font-weight:700}
  nav a{display:block;padding:6px 20px;color:var(--ink);text-decoration:none;font-size:14px;border-left:3px solid transparent}
  nav a:hover{background:#e7ebef;border-left-color:var(--blue)}
  nav a.on{font-weight:700;border-left-color:var(--blue);background:#e7ebef}
  main{padding:28px 40px 80px;max-width:980px}
  h1{font-size:28px;margin:0 0 6px}
  .lead{color:var(--muted);font-size:16px;margin:0 0 24px}
  .list{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
  .list li{border-bottom:1px solid var(--line)}
  .list a{display:flex;gap:18px;align-items:baseline;padding:14px 8px;text-decoration:none;color:var(--ink)}
  .list a:hover{background:var(--blue-soft)}
  .list .name{font-size:17px;font-weight:700;color:var(--blue);min-width:200px}
  .list .name kbd{font-family:Consolas,"D2Coding",monospace;font-size:14px;font-weight:400;color:var(--muted);margin-left:4px}
  .list .sum{color:var(--muted);font-size:14px}
  kbd{font-family:Consolas,"D2Coding",monospace;background:#eef1f4;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;font-size:13px}
  .note{border-left:4px solid var(--blue);background:var(--blue-soft);padding:10px 14px;border-radius:0 6px 6px 0;margin:24px 0}
  @media (max-width:820px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:20px 16px 60px}.list a{flex-direction:column;gap:2px}}
</style>
</head>
<body>
<header><span class="logo"><b>Ahjooeng</b> 도움말</span><span class="crumb">명령 목록</span></header>
<div class="wrap">
<nav id="ahj-nav" data-home="index.html"></nav>
<main>
<h1>Ahjooeng 도움말</h1>
<p class="lead">사용할 명령을 누르면 그 명령의 사용 방법이 나옵니다.</p>
<ul class="list" id="commands"></ul>
<noscript><p>목록을 보려면 브라우저에서 스크립트를 허용하세요. 범례 생성 설명서: <a href="../LegendAuto/Help/index.html">범례 생성 (LGD)</a></p></noscript>
<div class="note"><b>AutoCAD에서 열기</b><br>메뉴 막대 <b>Ahjooeng ▸ 도움말</b>을 누르면 이 목록이 열립니다(명령줄: <kbd>AHJOOENGHELP</kbd>).</div>
</main>
</div>
<script src="commands.js"></script>
<script src="nav.js"></script>
<script>
  (function () {
    var list = document.getElementById("commands");
    (window.AHJOOENG_COMMANDS || []).forEach(function (c) {
      var li = document.createElement("li"), a = document.createElement("a"), name = document.createElement("span"), kbd = document.createElement("kbd"), sum = document.createElement("span");
      a.href = c.page; name.className = "name"; name.textContent = c.title; kbd.textContent = "(" + c.command + ")"; name.appendChild(kbd);
      sum.className = "sum"; sum.textContent = c.summary || "";
      a.appendChild(name); a.appendChild(sum); li.appendChild(a); list.appendChild(li);
    });
  })();
</script>
</body>
</html>
